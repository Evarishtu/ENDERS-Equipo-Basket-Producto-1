<div class="player-overlay">
    <div class="player-detail">
        <button class="close-btn" (click)="close()">X</button>
        <div class="card shadow-lg detail-card">
            <div class="row g-0 align-items-center">
                <!--Foto-->
                <div class="col-12 col-md-4 text-center player-photo">
                    <h3 class="player-name">{{player?.nombre}} {{player?.apellidos}}</h3>
                    <img [src]="player?.foto" class="detail-img img-fluid m-3">
                    <p><strong>Posición: </strong>{{player?.posicion}}</p>
                    <p><strong>Edad: </strong>{{player?.edad}} años</p>
                    <p><strong>Altura: </strong>{{player?.altura}} m</p>
                </div>
                <!--Infomación y vídeo-->
                <div class="col-12 col-md-8">
                    <div class="card-body">
                        <div class="video-carousel" if="player?.videos?.length">
                            <button 
                                class="video-btn left" 
                                (click)="prevVideo()" 
                                if="currentVideoIndex > 0">
                                ◀
                            </button>
                            <div class="carousel-window">
                                <div class="carousel-current">
                                    <app-media-component 
                                        [video]="player?.videos?.[currentVideoIndex]">
                                    </app-media-component>
                                </div>
                            </div>
                            <button 
                                class="video-btn right"
                                (click)="nextVideo()" 
                                if="currentVideoIndex < (player?.videos?.length ?? 0) - 1">
                                ▶
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
