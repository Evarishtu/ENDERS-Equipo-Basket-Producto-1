<div class="player-details container mt-5 player-detail">
    <div class="card shadow-lg">
        <div class="row g-0 align-items-center">
            <!--Foto-->
            <div class="col-12 col-md-4 text-center player-photo">
                <img [src]="player?.foto" class="detail-img img-fluid">
            </div>
            <!--Infomación y vídeo-->
            <div class="col-12 col-md-8">
                <div class="card-body">

                    <h3 class="player-name">{{player?.nombre}} {{player?.apellidos}}</h3>
                    <p><strong>Posición: </strong>{{player?.posicion}}</p>
                    <p><strong>Edad: </strong>{{player?.edad}}</p>
                    <p><strong>Altura: </strong>{{player?.altura}}</p>

                    <div class="video-container mt-4">
                        <app-media-component [video]="player?.video"></app-media-component>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>
</div>
